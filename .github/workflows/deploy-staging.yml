name: Build & Deploy — Staging

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        working-directory: frontend
        run: |
          node --version
          npm --version
          npm install

      - name: Build React app
        working-directory: frontend
        run: npx vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build-staging
          path: frontend/dist
          retention-days: 1

  build-and-deploy-staging:
    name: Build Docker Image & Deploy to Staging ECS
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download React build
        uses: actions/download-artifact@v4
        with:
          name: react-build-staging
          path: src/main/resources/static

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: klondike-api
          IMAGE_TAG: staging-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:staging
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:staging
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to Staging ECS
        run: |
          # Scale up to 1 if currently at 0
          aws ecs update-service \
            --cluster klondike-cluster \
            --service klondike-staging-service \
            --task-definition klondike-api \
            --desired-count 1 \
            --force-new-deployment \
            --region eu-north-1

          echo "Waiting for staging service to stabilise (up to 15 min)..."
          MAX_WAIT=900
          ELAPSED=0
          DELAY=15
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ROLLOUT=$(aws ecs describe-services \
              --cluster klondike-cluster \
              --services klondike-staging-service \
              --region eu-north-1 \
              --query 'services[0].deployments[?status==`PRIMARY`].rolloutState | [0]' \
              --output text)
            echo "  rolloutState=${ROLLOUT} (${ELAPSED}s elapsed)"
            if [ "$ROLLOUT" = "COMPLETED" ]; then
              echo "Staging deployment complete"
              exit 0
            fi
            sleep $DELAY
            ELAPSED=$((ELAPSED + DELAY))
          done

          echo "=== Staging service did not stabilise — dumping events ==="
          aws ecs describe-services \
            --cluster klondike-cluster \
            --services klondike-staging-service \
            --region eu-north-1 \
            --query 'services[0].events[:10]' \
            --output table
          exit 1
