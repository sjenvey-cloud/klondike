name: iOS Deploy to TestFlight

# DEV-325 — archive the iOS app with MANUAL code signing (distribution certificate
# + App Store provisioning profile imported from secrets) and upload it to
# TestFlight. Manual signing avoids the flaky cloud-managed signing path.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   Signing:
#     BUILD_CERTIFICATE_BASE64      – your "Apple Distribution" cert exported from
#                                     Keychain as a .p12, base64-encoded:
#                                       base64 -i dist.p12 | pbcopy
#     P12_PASSWORD                  – the password you set when exporting the .p12
#     PROVISIONING_PROFILE_BASE64   – an App Store provisioning profile for
#                                     com.klondikepro.app (.mobileprovision), base64:
#                                       base64 -i profile.mobileprovision | pbcopy
#   Upload (already added):
#     APP_STORE_CONNECT_API_KEY_ID
#     APP_STORE_CONNECT_API_ISSUER_ID
#     APP_STORE_CONNECT_API_KEY_BASE64

on:
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios-deploy.yml'
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive & Upload — TestFlight
    runs-on: macos-15
    env:
      SCHEME: KlondikePro
      TEAM_ID: KAH7N724C5
      BUNDLE_ID: com.klondikepro.app
      MARKETING_VERSION: "1.0"
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Import signing certificate & provisioning profile
        env:
          CERT_B64:    ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PW:     ${{ secrets.P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"

          echo -n "$CERT_B64"    | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

          # Temporary keychain holding the distribution certificate.
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PW" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN"

          # Install the profile and extract its name (used by the export step).
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PLIST=$(security cms -D -i "$PROFILE_PATH")
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$PLIST")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Imported profile '$NAME' ($UUID)"

      - name: Install App Store Connect API key (upload only)
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Archive
        working-directory: ios-app
        run: |
          xcodebuild \
            -project KlondikePro.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KlondikePro.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            clean archive

      - name: Export .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KlondikePro.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
