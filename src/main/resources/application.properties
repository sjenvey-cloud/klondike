spring.datasource.url=jdbc:postgresql://localhost:5432/solitaire_db
spring.datasource.username=sjenvey
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# JWT RS256 keys — injected from environment / AWS Secrets Manager at runtime
# For local dev: set these env vars before running mvn spring-boot:run
KLONDIKE_JWT_PRIVATE_KEY=${KLONDIKE_JWT_PRIVATE_KEY}
KLONDIKE_JWT_PUBLIC_KEY=${KLONDIKE_JWT_PUBLIC_KEY}

# Public base URL used for invite links — override via APP_BASE_URL env var in production
app.base-url=${APP_BASE_URL:https://klondikepro.app}

# Redis — ElastiCache endpoint injected via ECS task definition env var (DEV-165)
# Falls back to localhost for local dev (Redis not required locally)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=60000

# Springdoc / Swagger UI (DEV-231)
# /swagger-ui redirects to /swagger-ui/index.html; /v3/api-docs serves the raw spec
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Avatar upload — S3 bucket, CDN base URL, region (DEV-229)
# Override via ECS task-definition env vars in production
app.avatar.bucket=${AVATAR_BUCKET:klondike-avatars}
app.avatar.cdn-url=${AVATAR_CDN_URL:https://klondike-avatars.s3.eu-north-1.amazonaws.com}
app.avatar.region=${AWS_REGION:eu-north-1}

# APNs push notifications (DEV-311) — injected from env / AWS Secrets Manager.
# Leave blank to run with push DISABLED (NotificationService no-ops gracefully).
# APNS_KEY_P8 holds the full PEM contents of the AuthKey_XXXXXXXXXX.p8 file.
apns.key-p8=${APNS_KEY_P8:}
apns.key-id=${APNS_KEY_ID:}
apns.team-id=${APNS_TEAM_ID:}
apns.bundle-id=${APNS_BUNDLE_ID:com.klondikepro.app}
apns.production=${APNS_PRODUCTION:false}
