# DEV-165/166: Redis + cache settings (application.properties is gitignored)
spring:
  cache:
    type: redis
    redis:
      time-to-live: 60000
  data:
    redis:
      connect-timeout: 2000
      timeout: 2000
      lettuce:
        pool:
          enabled: false
        shutdown-timeout: 100ms

# Exclude ALL health indicators except the basic liveness check.
# Redis / cache blips must never cause ECS to kill the container.
management:
  health:
    redis:
      enabled: false
    cache:
      enabled: false
    db:
      enabled: false
    defaults:
      enabled: true
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
