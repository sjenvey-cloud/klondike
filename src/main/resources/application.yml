# DEV-165/166: Redis + cache settings (application.properties is gitignored)
spring:
  cache:
    type: redis
    redis:
      time-to-live: 60000

# Exclude Redis and cache health indicators from the ALB health check.
# A Redis blip must never cause ECS to consider the container unhealthy.
management:
  health:
    redis:
      enabled: false
    cache:
      enabled: false
  endpoint:
    health:
      show-details: never
