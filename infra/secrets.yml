AWSTemplateFormatVersion: '2010-09-09'
Description: Klondike Secrets Manager - DB credentials and JWT signing key

Parameters:
  EnvironmentName:
    Type: String
    Default: klondike

  DBUsername:
    Type: String
    Default: klondike
    NoEcho: true

  DBPassword:
    Type: String
    NoEcho: true

  JWTSecretValue:
    Type: String
    NoEcho: true
    Description: Secret key for signing JWT tokens (min 32 chars)

Resources:

  # ---------- DB Credentials Secret ----------
  DBCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '/${EnvironmentName}/db/credentials'
      Description: RDS PostgreSQL credentials for Klondike API
      SecretString: !Sub |
        {
          "username": "${DBUsername}",
          "password": "${DBPassword}",
          "host": "klondike-postgres.cjcmiy04a05b.eu-north-1.rds.amazonaws.com",
          "port": "5432",
          "dbname": "solitaire_db",
          "url": "jdbc:postgresql://klondike-postgres.cjcmiy04a05b.eu-north-1.rds.amazonaws.com:5432/solitaire_db"
        }
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  # ---------- JWT Signing Secret ----------
  JWTSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '/${EnvironmentName}/jwt/secret'
      Description: JWT signing secret for Klondike API authentication
      SecretString: !Sub |
        {
          "secret": "${JWTSecretValue}"
        }
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  # ---------- IAM Policy - ECS task read access ----------
  SecretsReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${EnvironmentName}-secrets-read-policy'
      Description: Allows ECS tasks to read Klondike secrets from Secrets Manager
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Ref DBCredentialsSecret
              - !Ref JWTSigningSecret

Outputs:
  DBCredentialsSecretArn:
    Description: ARN of the DB credentials secret
    Value: !Ref DBCredentialsSecret
    Export:
      Name: !Sub '${EnvironmentName}-DBCredentialsSecretArn'

  JWTSecretArn:
    Description: ARN of the JWT signing secret
    Value: !Ref JWTSigningSecret
    Export:
      Name: !Sub '${EnvironmentName}-JWTSecretArn'

  SecretsReadPolicyArn:
    Description: ARN of the IAM policy for reading secrets
    Value: !Ref SecretsReadPolicy
    Export:
      Name: !Sub '${EnvironmentName}-SecretsReadPolicyArn'
