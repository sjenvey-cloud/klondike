AWSTemplateFormatVersion: '2010-09-09'
Description: Klondike ECS Fargate cluster and task definition

Parameters:
  EnvironmentName:
    Type: String
    Default: klondike

  ECRImageURI:
    Type: String
    Default: '586917956128.dkr.ecr.eu-north-1.amazonaws.com/klondike-api:latest'
    Description: Full ECR image URI including tag

  DBUsername:
    Type: String
    Default: klondike
    NoEcho: true

  DBPassword:
    Type: String
    NoEcho: true

Resources:

  # ---------- CloudWatch Log Group ----------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}-api'
      RetentionInDays: 14

  # ---------- IAM Roles ----------
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ecs-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRAndSecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/klondike/jwt/secret*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/klondike/db/credentials*'

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ecs-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  # ---------- ECS Cluster ----------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-cluster'
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  # ---------- Task Definition ----------
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-api'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ECRImageURI
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: SPRING_DATASOURCE_URL
              Value: !Sub
                - 'jdbc:postgresql://${Endpoint}:5432/solitaire_db'
                - Endpoint: !ImportValue klondike-DBEndpoint
            - Name: SPRING_DATASOURCE_USERNAME
              Value: !Ref DBUsername
            - Name: SPRING_DATASOURCE_PASSWORD
              Value: !Ref DBPassword
            - Name: SPRING_JPA_HIBERNATE_DDL_AUTO
              Value: validate
            - Name: SPRING_REDIS_HOST
              Value: !ImportValue klondike-RedisEndpoint
            - Name: SPRING_REDIS_PORT
              Value: '6379'
            - Name: SPRING_DATA_REDIS_HOST
              Value: !ImportValue klondike-RedisEndpoint
            - Name: SPRING_DATA_REDIS_PORT
              Value: '6379'
            - Name: SPRING_CACHE_TYPE
              Value: redis
            - Name: SPRING_CACHE_REDIS_TIME_TO_LIVE
              Value: '60000'
            - Name: SERVER_PORT
              Value: '8080'
          Secrets:
            - Name: KLONDIKE_JWT_PRIVATE_KEY
              ValueFrom: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/klondike/jwt/secret-1PSTp8:privateKey::'
            - Name: KLONDIKE_JWT_PUBLIC_KEY
              ValueFrom: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/klondike/jwt/secret-1PSTp8:publicKey::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          HealthCheck:
            Command:
              - CMD-SHELL
              - 'wget -qO /dev/null http://localhost:8080/actuator/health || exit 1'
            Interval: 30
            Timeout: 10
            Retries: 5
            StartPeriod: 120
          Essential: true

Outputs:
  ClusterName:
    Description: ECS Cluster name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${EnvironmentName}-ClusterName'

  ClusterArn:
    Description: ECS Cluster ARN
    Value: !GetAtt ECSCluster.Arn
    Export:
      Name: !Sub '${EnvironmentName}-ClusterArn'

  TaskDefinitionArn:
    Description: Task Definition ARN
    Value: !Ref TaskDefinition
    Export:
      Name: !Sub '${EnvironmentName}-TaskDefinitionArn'

  TaskExecutionRoleArn:
    Description: ECS Task Execution Role ARN
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub '${EnvironmentName}-TaskExecutionRoleArn'
