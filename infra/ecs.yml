AWSTemplateFormatVersion: '2010-09-09'
Description: Klondike ECS Fargate cluster and task definition

# ─────────────────────────────────────────────────────────────────────────────
# RECONCILED 2026-06-09 to match the actually-running task definition (rev 7).
# Prior to this, the repo template had drifted badly from reality (invalid
# 512/768 CPU/mem, an X-Ray sidecar, Redis-cache + read-replica config, and a
# task role that omitted the avatar-S3 + secrets-read policies that prod
# actually uses). The running task def has been managed by hand; this brings the
# IaC back in line so it is trustworthy again.
#
# Source of truth captured from:
#   aws ecs describe-task-definition --task-definition klondike-api
#   aws iam get-role-policy / list-attached-role-policies (both roles)
# ─────────────────────────────────────────────────────────────────────────────

Parameters:
  EnvironmentName:
    Type: String
    Default: klondike

  ECRImageURI:
    Type: String
    Default: '586917956128.dkr.ecr.eu-north-1.amazonaws.com/klondike-api:latest'
    Description: Full ECR image URI including tag

  DBUsername:
    Type: String
    Default: klondike
    NoEcho: true

  DBPassword:
    Type: String
    NoEcho: true

  AppBaseUrl:
    Type: String
    Default: 'https://klondikepro.app'
    Description: Public base URL used for invite links (APP_BASE_URL)

  # ---------- APNs (DEV-311) — defaults are the live values ----------
  ApnsKeyId:
    Type: String
    Default: 'DMKW74X34D'
    Description: 10-char APNs auth key ID

  ApnsTeamId:
    Type: String
    Default: 'KAH7N724C5'
    Description: 10-char Apple Developer Team ID

  ApnsProduction:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: 'true = production APNs host; false = sandbox (Xcode dev builds)'

  ApnsKeyP8SecretArn:
    Type: String
    Default: 'arn:aws:secretsmanager:eu-north-1:586917956128:secret:/klondike/apns/key-9mPfV9'
    Description: Secrets Manager ARN of the .p8 secret (JSON key `keyP8`), no suffix

Resources:

  # ---------- CloudWatch Log Group ----------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}-api'
      RetentionInDays: 14

  # ---------- IAM: Task Execution Role (pulls image + secrets) ----------
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ecs-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/klondike/jwt/secret*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/klondike/db/credentials*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/klondike/apns/*'

  # ---------- IAM: Task Role (app runtime permissions) ----------
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ecs-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:aws:iam::${AWS::AccountId}:policy/klondike-secrets-read-policy'
      Policies:
        - PolicyName: klondike-avatar-s3-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AvatarUpload
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: 'arn:aws:s3:::klondike-avatars/*'

  # ---------- ECS Cluster ----------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-cluster'
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  # ---------- Task Definition ----------
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-api'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ECRImageURI
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              HostPort: 8080
              Protocol: tcp
          Environment:
            - Name: SERVER_PORT
              Value: '8080'
            - Name: SPRING_DATASOURCE_URL
              Value: !Sub
                - 'jdbc:postgresql://${Endpoint}:5432/solitaire_db'
                - Endpoint: !ImportValue klondike-DBEndpoint
            - Name: SPRING_DATASOURCE_USERNAME
              Value: !Ref DBUsername
            - Name: SPRING_DATASOURCE_PASSWORD
              Value: !Ref DBPassword
            - Name: SPRING_JPA_HIBERNATE_DDL_AUTO
              Value: validate
            - Name: SPRING_REDIS_HOST
              Value: !ImportValue klondike-RedisEndpoint
            - Name: SPRING_REDIS_PORT
              Value: '6379'
            - Name: APP_BASE_URL
              Value: !Ref AppBaseUrl
            - Name: APNS_KEY_ID
              Value: !Ref ApnsKeyId
            - Name: APNS_TEAM_ID
              Value: !Ref ApnsTeamId
            - Name: APNS_PRODUCTION
              Value: !Ref ApnsProduction
            - Name: APNS_BUNDLE_ID
              Value: com.klondikepro.app
          Secrets:
            - Name: KLONDIKE_JWT_PRIVATE_KEY
              ValueFrom: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/klondike/jwt/secret-1PSTp8:privateKey::'
            - Name: KLONDIKE_JWT_PUBLIC_KEY
              ValueFrom: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/klondike/jwt/secret-1PSTp8:publicKey::'
            - Name: APNS_KEY_P8
              ValueFrom: !Sub '${ApnsKeyP8SecretArn}:keyP8::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          HealthCheck:
            Command:
              - CMD-SHELL
              - 'wget -qO /dev/null http://localhost:8080/actuator/health || exit 1'
            Interval: 30
            Timeout: 10
            Retries: 5
            StartPeriod: 120

Outputs:
  ClusterName:
    Description: ECS Cluster name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${EnvironmentName}-ClusterName'

  ClusterArn:
    Description: ECS Cluster ARN
    Value: !GetAtt ECSCluster.Arn
    Export:
      Name: !Sub '${EnvironmentName}-ClusterArn'

  TaskDefinitionArn:
    Description: Task Definition ARN
    Value: !Ref TaskDefinition
    Export:
      Name: !Sub '${EnvironmentName}-TaskDefinitionArn'

  TaskExecutionRoleArn:
    Description: ECS Task Execution Role ARN
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub '${EnvironmentName}-TaskExecutionRoleArn'
