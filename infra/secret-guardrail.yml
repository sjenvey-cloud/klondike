AWSTemplateFormatVersion: '2010-09-09'
Description: >
  INFRA-6: deletion guardrail for Klondike's critical Secrets Manager secrets.
  Attaches a resource policy that DENIES secretsmanager:DeleteSecret to every
  principal, so a secret can't be accidentally scheduled for deletion (the JWT
  near-miss). Only DeleteSecret is denied — GetSecretValue / PutSecretValue /
  rotation are unaffected, so the app and key rotation keep working.

  To legitimately delete a secret later: delete this stack (or remove the
  relevant resource), THEN delete the secret. That deliberate two-step is the
  whole point.

Parameters:
  JwtSecretArn:
    Type: String
    Default: 'arn:aws:secretsmanager:eu-north-1:586917956128:secret:/klondike/jwt/secret-1PSTp8'
  DbSecretArn:
    Type: String
    Default: 'arn:aws:secretsmanager:eu-north-1:586917956128:secret:/klondike/db/credentials-rG6Qw3'
  ApnsSecretArn:
    Type: String
    Default: 'arn:aws:secretsmanager:eu-north-1:586917956128:secret:/klondike/apns/key-9mPfV9'

Resources:

  JwtSecretGuard:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref JwtSecretArn
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyScheduledDeletion
            Effect: Deny
            Principal: '*'
            Action: secretsmanager:DeleteSecret
            Resource: '*'

  DbSecretGuard:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref DbSecretArn
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyScheduledDeletion
            Effect: Deny
            Principal: '*'
            Action: secretsmanager:DeleteSecret
            Resource: '*'

  ApnsSecretGuard:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref ApnsSecretArn
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyScheduledDeletion
            Effect: Deny
            Principal: '*'
            Action: secretsmanager:DeleteSecret
            Resource: '*'

Outputs:
  GuardedSecrets:
    Description: Secrets protected from accidental DeleteSecret
    Value: !Sub '${JwtSecretArn}, ${DbSecretArn}, ${ApnsSecretArn}'
