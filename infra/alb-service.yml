AWSTemplateFormatVersion: '2010-09-09'
Description: Klondike ALB and ECS Fargate service

Parameters:
  EnvironmentName:
    Type: String
    Default: klondike

  DesiredCount:
    Type: Number
    Default: 2
    Description: Number of ECS tasks to run

Resources:

  # ---------- Application Load Balancer ----------
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue klondike-PublicSubnet1Id
        - !ImportValue klondike-PublicSubnet2Id
      SecurityGroups:
        - !ImportValue klondike-ALBSecurityGroupId
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  # ---------- Target Group ----------
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-api-tg'
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !ImportValue klondike-VPCId
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  # ---------- ALB Listener ----------
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------- ECS Service ----------
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub '${EnvironmentName}-api-service'
      Cluster: !ImportValue klondike-ClusterArn
      # Reference the task-def FAMILY (latest active revision) rather than a pinned
      # ARN imported from the ecs stack. Pinning the ARN deadlocked task-def edits:
      # updating ecs.yml changed the exported ARN while this stack imported it, which
      # CloudFormation blocks. With the family, new revisions roll out via
      # `aws ecs update-service --force-new-deployment` (same as image deploys).
      TaskDefinition: !Sub '${EnvironmentName}-api'
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue klondike-PrivateSubnet1Id
            - !ImportValue klondike-PrivateSubnet2Id
          SecurityGroups:
            - !ImportValue klondike-ECSSecurityGroupId
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        # INFRA-5: auto-roll-back a deployment whose tasks never reach steady state
        # (e.g. a bad task-def revision). Without this, a failed deploy sticks
        # indefinitely on the old tasks (as happened during APNs activation).
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      # INFRA-1 root cause: the app's cold start (image pull + secret fetch + ~65s
      # Spring Boot start + lazy DispatcherServlet init) takes ~100-110s to first
      # serve /actuator/health. The old 90s grace let the ELB start health-checking
      # before the app was responsive, killing healthy tasks — and adding the DB
      # password as a 3rd secret pushed a borderline startup over the edge. 240s
      # gives ample headroom and hardens every deploy.
      HealthCheckGracePeriodSeconds: 240

  # ---------- Auto Scaling ----------
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: ECSService
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub 'service/${EnvironmentName}-cluster/${EnvironmentName}-api-service'
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: 2
      MaxCapacity: 20
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    DependsOn: ScalableTarget
    Properties:
      PolicyName: !Sub '${EnvironmentName}-cpu-target-tracking'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60.0
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

Outputs:
  ALBDNSName:
    Description: ALB DNS name (public API endpoint)
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub '${EnvironmentName}-ALBDNSName'

  ALBArn:
    Description: ALB ARN
    Value: !Ref ALB
    Export:
      Name: !Sub '${EnvironmentName}-ALBArn'

  TargetGroupArn:
    Description: Target Group ARN
    Value: !Ref TargetGroup
    Export:
      Name: !Sub '${EnvironmentName}-TargetGroupArn'

  ECSServiceName:
    Description: ECS Service name
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub '${EnvironmentName}-ECSServiceName'
