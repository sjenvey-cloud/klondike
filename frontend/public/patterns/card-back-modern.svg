<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40">
  <rect width="40" height="40" fill="#2563eb"/>
  <pattern id="diagonalgrid" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
    <line x1="0" y1="10" x2="10" y2="0" stroke="#1d4ed8" stroke-width="1.2"/>
    <line x1="-2" y1="2" x2="2" y2="-2" stroke="#1d4ed8" stroke-width="1.2"/>
    <line x1="8" y1="12" x2="12" y2="8" stroke="#1d4ed8" stroke-width="1.2"/>
  </pattern>
  <rect width="40" height="40" fill="url(#diagonalgrid)"/>
  <rect width="40" height="40" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
</svg>
