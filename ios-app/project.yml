name: KlondikePro
options:
  bundleIdPrefix: com.klondikepro
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: KlondikePro/Info.plist
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # set in Xcode → Signing & Capabilities
    ENABLE_HARDENED_RUNTIME: "YES"
    SWIFT_STRICT_CONCURRENCY: targeted   # upgrade to complete in Sprint iOS-7 once all actors are annotated

targets:
  KlondikePro:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KlondikePro
        excludes:
          - "**/*.md"
    resources:
      - path: KlondikePro/Resources/Assets.xcassets
      - path: KlondikePro/Resources/PrivacyInfo.xcprivacy   # DEV-323 privacy manifest
    info:
      path: KlondikePro/Info.plist
      properties:
        CFBundleDisplayName: Klondike Pro
        CFBundleName: KlondikePro
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: AppBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Used for taking a profile photo."
        NSPhotoLibraryUsageDescription: "Used for selecting a profile photo."
        NSGameCenterNetworkingMultiplayerSupportedModes: []
        # DEV-334: required for GKLocalPlayer.loadFriends() — without it the friend
        # list request throws and the import fails.
        NSGKFriendListUsageDescription: "Klondike Pro uses your Game Center friends list to find friends who already play, so you can add and challenge them."
        API_BASE_URL: https://d2fbehwb6bp7kq.cloudfront.net
        # DEV-301: klondikepro://friends/invite/{token} custom URL scheme
        CFBundleURLTypes:
          - CFBundleURLName: com.klondikepro.app
            CFBundleURLSchemes:
              - klondikepro
    entitlements:
      path: KlondikePro/Resources/KlondikePro.entitlements
      properties:
        com.apple.developer.game-center: true
        # APNs entitlement. "production" is required for TestFlight / App Store
        # distribution and is what the App Store provisioning profile expects.
        # (TestFlight uses the production APNs host — pair with backend
        # APNS_PRODUCTION=true to actually deliver push to TestFlight builds.)
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.klondikepro.app
    scheme:
      environmentVariables:
        API_BASE_URL: https://d2fbehwb6bp7kq.cloudfront.net

  KlondikeProTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - KlondikeProTests
    dependencies:
      - target: KlondikePro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.klondikepro.tests

schemes:
  KlondikePro:
    build:
      targets:
        KlondikePro: all
        KlondikeProTests: testing
    run:
      config: Debug
      environmentVariables:
        API_BASE_URL: https://d2fbehwb6bp7kq.cloudfront.net
    test:
      config: Debug
      targets:
        - target: KlondikeProTests
          randomExecutionOrder: false
    profile:
      config: Release
    archive:
      config: Release

  KlondikeProDebugLocal:
    build:
      targets:
        KlondikePro: all
    run:
      config: Debug
      environmentVariables:
        API_BASE_URL: http://localhost:8080
