name: KlondikePro
options:
  bundleIdPrefix: com.klondikepro
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: KlondikePro/Info.plist
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # set in Xcode → Signing & Capabilities
    ENABLE_HARDENED_RUNTIME: "YES"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  KlondikePro:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KlondikePro
        excludes:
          - "**/*.md"
    resources:
      - path: KlondikePro/Resources/Assets.xcassets
    info:
      path: KlondikePro/Info.plist
      properties:
        CFBundleDisplayName: Klondike Pro
        CFBundleName: KlondikePro
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: AppBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Used for taking a profile photo."
        NSPhotoLibraryUsageDescription: "Used for selecting a profile photo."
        NSGameCenterNetworkingMultiplayerSupportedModes: []
        API_BASE_URL: https://d2fbehwb6bp7kq.cloudfront.net
    entitlements:
      path: KlondikePro/Resources/KlondikePro.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.klondikepro.app
    scheme:
      environmentVariables:
        API_BASE_URL: https://d2fbehwb6bp7kq.cloudfront.net

  KlondikeProTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - KlondikeProTests
    dependencies:
      - target: KlondikePro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.klondikepro.tests

schemes:
  KlondikePro:
    build:
      targets:
        KlondikePro: all
        KlondikeProTests: testing
    run:
      config: Debug
      environmentVariables:
        API_BASE_URL: https://d2fbehwb6bp7kq.cloudfront.net
    test:
      config: Debug
      targets:
        - KlondikeProTests
    profile:
      config: Release
    archive:
      config: Release

  KlondikeProDebugLocal:
    build:
      targets:
        KlondikePro: all
    run:
      config: Debug
      environmentVariables:
        API_BASE_URL: http://localhost:8080
